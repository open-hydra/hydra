[HYDRA-Parameters]
N-coupling = 200000
FUSS-iter  = 1
MOSE-iter  = 1
time-accurate = false

[HYDRA-IO]
coupling-diter = 20000
coupling-wall  = true
coupling-overwrite = false

;

[MOSE-Parameters]
newrun = true
res-threshold = 1.0e-8

[MOSE-Physics]
equations = navier-stokes

[MOSE-Numerics]
time-scheme           = RK3
cfl                   = 0.55
vnn                   = 0.55
time-accurate         = false
riemann-solver        = HLLC
flux-limiter          = minmod
space-reconstruction  = MUSCL
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[MOSE-IO]
sol-overwrite = true
sol-format    = tecplot ascii

;

[FUSS-Parameters]
newrun = true
res-threshold = 1.0e-8

[FUSS-Numerics]
time-scheme           = RK3
vnn                   = 0.25
time-accurate         = false
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[FUSS-IO]
sol-overwrite = true
sol-format    = tecplot ascii


[GPB-Phase1]
type = ideal-gas 
name = gas
species = air
gamma = 1.4
R     = 287.0
mil   = 1.79352e-4
Pr    = 0.7

[GPB-Phase2]
type = solid
name = plate
material = mat
cp  = 700
rho = 10000
k   = 10.2746

;

[ICB-Block1]
phase = gas
type  = homogeneous
p0   = 1.02828e5
T    = 293.0
mach = 0.2

[ICB-Block2]
phase    = plate
material = mat
type     = homogeneous
T    = 343.0

;

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[T_plate]
type = wall
T = 393.0

