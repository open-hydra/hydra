; ----------------------------------------------------------------------------
; ice-al-box-direct: a cloud of liquid aluminium burns with the steam of the gas
; in ICE (direct at 2791 K, down to d-stop).
; The alumina is born in family 2 of ICE's phase, empty at the start. A
; 20x20x1 box of quiescent gas at 2791 K, periodic in x. Cycle 1:
; one forward-Euler ICE step at the initial state (its smoke born at its end);
; cycle 2: the source of that step frozen through 200 MOSE iterations. ATLAS
; writes INPUT; the velocity and number density of family 1 are then written
; exactly (make_al_boxes8.py, test/ice-box/make_case.py's format).
; test/mi2-checks/p30_al_smoke.py holds the closed forms.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 1 200
MOSE-iter     = 0 1
ICE-iter      = 1 0
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 200
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo

[ICE-Parameters]
phase         = part
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
time-accurate        = true
space-reconstruction = first-order

; the tables of the materials give their density and heat capacity
[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
emissivity    = 0 0

[ICE-Family1]
closure = MK

[ICE-Family2]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

[MI2-Coupling]
report = true

; the condensed velocity written into INPUT/part-ic.tec, family 1 [m/s, along x]
[ice-box]
up = 1.0

; the gas: nitrogen, steam, hydrogen (the alumina is not a species of it)
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O H2
thermo    = NASA9
transport = cantera
Tmax      = 4000

; liquid aluminium (family 1) and liquid alumina, the smoke (family 2), of the
; NASA9 database with their tables; the densities are the deck's constants
[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian
name     = part
thermo   = NASA9
material = AL(L) AL2O3(L)
groups   = 1 1
rho      = 1540 2606
psat-vapour = AL none
particle-mechanism = al-h2o
; the d2 law of test/igloo-al-box-direct at 2791 K down to half the diameter
combustion = direct none
T-burn     = 2791
q-comb     = 9.53e6
d-stop     = 1.0e-5
d-smoke    = 3.0e-6
; the smoke AL2O3(L) freezes below 2327 K, where AL2O3(a) of nasa9.yaml ends
; (GPB stops a smoke whose table crosses it without ICE's solidification
; model): the heat of fusion and the solid's cp at 2327 K of the database,
; nucleation at ICE's default, 0.8 of T-melt
; (0 for AL(L): not given)
solidification = off on
T-melt         = 0 2327
h-fus          = 0 1.092578e6
cp-solid       = 0 1433.17
T-nuc          = 0 1861.6

; quiescent steam and nitrogen at 2791 K; the aluminium at 0.1 of the gas
; density at the gas temperature, 20 um; the smoke family empty
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 2791.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 0.5
yH2O = 0.5
yH2  = 0.0
krho = 0.1 0.0
kT   = 1.0 1.0
dp   = 20e-6

[BCB-Block1]
face1 = per
face2 = per
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[per]
type  = periodic
faces = 1 2
