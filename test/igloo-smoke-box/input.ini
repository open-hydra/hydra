; ----------------------------------------------------------------------------
; igloo-smoke-box -- test/igloo-burnout-box with a smoke: the four IGLOO streams
; of A burn into N2 and alumina AL2O3(a), half of the mass each, and the
; alumina is born in the ICE phase partE (one MK family, empty at the start)
; at d-smoke 3 um, with the burning parcels' velocity and temperature.
; ATLAS writes INPUT (GPB with the smoke record, ICB, BCB); MESH is the
; burnout box's. check.py holds the closed forms of the three bodies.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
; cycle 1 is test/igloo-burnout-box's: six coupling steps, each a MOSE block
; of 50 iterations with IGLOO's sources, after which the smoke of the block
; joins ICE; cycle 2 is one ICE step (the two solvers do not share a time
; step), which writes ICE's field
N-coupling    = 6 1
MOSE-iter     = 50 0
IGLOO-iter    = 1 0
ICE-iter      = 0 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

[IGLOO-General]
phase       = partL
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 1.0
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 300.0

[ICE-Parameters]
phase         = partE
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
dt-max               = 1.0e-5
time-accurate        = true
space-reconstruction = first-order

; the smoke keeps what it was born with: no exchange with the gas, so ICE's
; field holds the books of the birth (the table gives density and heat capacity)
[ICE-Physics]
drag          = NoDrag
heat-transfer = NoHeat
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
rho      = 1000
cp       = 4184
; the enthalpy of A at 298.15 K on the formation scale of the gas
h0                 = -7.2e6
particle-mechanism = a-smoke
combustion = Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 290
beta-part  = 0.3
q-comb     = 1.0e6
d-burnout  = 3.0e-6
d-smoke    = 3.0e-6

[GPB-Phase3]
type     = condensed-dispersed
modeling = eulerian
name     = partE
thermo   = NASA9
material = AL2O3(a)
groups   = 1
rho      = 2606
; the table of AL2O3(a) ends at its melting point, 2327 K, where AL2O3(L)
; begins (GPB stops a solid smoke whose table runs past it); the box stays
; below 700 K
Tmax     = 2327

[ICB-Block1]
type = homogeneous
; no smoke at the start: ICE's family is empty
krho = 0.0
kT   = 1.0
p    = 101325.0
T    = 400.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
dp   = 3e-6

[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

[MI2-Coupling]
report = true
