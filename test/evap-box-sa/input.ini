; ----------------------------------------------------------------------------
; evap-box-sa: closed quiescent box, water droplets evaporating into N2, the gas
; solved as RANS (Navier-Stokes with the Spalart-Allmaras closure), time accurate.
;
; The gas carries one primitive more than the Euler run of evap-box-ta: the SA
; variable mi_tilde (density times the modified eddy viscosity), stored after the
; energy slot. The coupler adds the droplet sources to the species, momentum and
; energy slots and must leave that one alone. The run prints the closed-domain
; mass balance and the energy bookkeeping at the end; the gate
; test/mi2-checks/p13_rans_slot_check.sh reads them and the SA field (check.py).
;
; Every face is a symmetry plane, as in evap-box-ta: no mass, momentum, heat or
; species crosses a boundary, so both balances are exact identities. The domain
; has no wall face, so MOSE gives every cell its no-wall sentinel distance
; (1e8 m): the SA destruction term vanishes and the SA variable is transported
; with the vorticity production only.
;
; Mesh: MESH/mesh.tec, 20x20x1 cells over 0.1 x 0.1 x 0.005 m.
; ----------------------------------------------------------------------------

; schedule: 20 coupling steps of 50 MOSE iterations each, IGLOO solved once per step
[HYDRA-Parameters]
N-coupling    = 20
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE: the gas, RANS
; ---------------------------------------------------------------------------
; the residual threshold is below anything the run reaches: the length of the
; run is set by N-coupling
[MOSE-Parameters]
res-threshold = 1e-30

; Navier-Stokes with the Spalart-Allmaras closure; the species diffuse with a
; constant Schmidt number (the multicomponent model, selected by a zero
; Schmidt number, is not used here)
[MOSE-Physics]
equations  = navier-stokes
turbulence = SA
schmidt    = 0.7

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; the field is written at the end of every coupling step with the transport
; properties, so it carries mi_tilde, the laminar viscosity mil and the eddy
; viscosity mit
[MOSE-IO]
shell-diter   = 50
sol-diter     = 50
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; IGLOO: Lagrangian water droplets, four streams placed in the box
; ---------------------------------------------------------------------------
; the ATLAS phase name: IGLOO reads INPUT/part-{phase.txt,properties.dat,bc.txt}
[IGLOO-General]
phase       = part
gas-order   = 1
print-dcell = 1

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

; psat is accepted and ignored: the Psat column of part-properties.dat takes precedence
; the latent heat, the vapour molar mass and the vapour cp are the Lv, Mv and Cpv columns of
; part-properties.dat, which ATLAS GPB writes for the psat-vapour pair
[IGLOO-Properties]
Tboil = 373.15
Le    = 1.0
Yinf  = 0.0
psat  = 3.0e3

; four streams on a line across the middle of the box, moving slowly in +x
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

; ---------------------------------------------------------------------------
; ATLAS: the phases, the initial and the boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O
thermo    = NASA9
transport = cantera
Tmax      = 3000

; liquid water, solved by IGLOO. h0 is the enthalpy at 298.15 K, the formation
; enthalpy of liquid water, so GPB writes an absolute enthalpy column; the
; saturation pressure comes from the liquid/vapour pair of the NASA9 database
[GPB-Phase2]
type        = condensed-dispersed
modeling    = lagrangian
name        = part
rho         = 997
cp          = 4184
h0          = -15866000
psat-liquid = H2O(L)
psat-vapour = H2O
alpha-e     = 1.0

; quiescent pure N2 at 101325 Pa and 350 K. rhoNuTilde is the SA variable MOSE carries,
; density times the modified eddy viscosity in kg/m/s: three times the laminar
; viscosity of N2 at 350 K, the value the SA model recommends far from walls.
; dp is the initial droplet diameter
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
yH2O = 0.0
dp   = 20e-6
rhoNuTilde = 6.0e-5

; closed box: every face a symmetry plane, mirrored for the droplets too
[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

; ---------------------------------------------------------------------------
; MI2: the evaporated water enters the gas as the H2O species
; ---------------------------------------------------------------------------
[MI2-Coupling]
products-A = H2O:1.0
