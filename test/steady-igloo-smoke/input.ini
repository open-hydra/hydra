; steady-igloo-smoke: a steady through-flow case (README.md): the JPL nozzle
; of test/JPL-Eulerian-20micron at 38 x 8 cells, steady, MOSE and ICE in one cycle on JPL's schedule. Gate
; test/mi2-checks/p31_steady_check.sh: the converged field does not depend on the local time steps.

[HYDRA-Parameters]
N-coupling    = 40
MOSE-iter     = 500
IGLOO-iter    = 1
ICE-iter      = 250
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

[MI2-Coupling]
report = true

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.5
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 500
sol-diter     = 500
sol-format    = tecplot ascii
sol-variables = thermo

[ICE-Parameters]
phase         = partE
res-threshold = 0

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 250
sol-diter   = 250
sol-format  = tecplot ascii
ic-format   = tecplot ascii

[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 38
ny     = 8

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = symmetry

[ax]
type = symmetry

[IGLOO-General]
phase       = partL
print-dcell = 1

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
ds            = 0.01
iprint        = 1
reference-dir = velocity

[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
rho      = 1000
cp       = 4184
h0                 = -7.2e6
particle-mechanism = a-smoke
combustion = Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 290
beta-part  = 0.3
q-comb     = 1.0e6
d-burnout  = 3.0e-6
d-smoke    = 3.0e-6

[GPB-Phase3]
type     = condensed-dispersed
modeling = eulerian
name     = partE
thermo   = NASA9
material = AL2O3(a)
groups   = 1
rho      = 2606
; the table of AL2O3(a) ends at its melting point, 2327 K, where AL2O3(L)
; begins (GPB stops a solid smoke whose table runs past it); the box stays
; below 700 K
Tmax     = 2327

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 555.56
krho = 0.0
dp   = 3e-6

[inj]
type = inlet
p0   = 1.0342e6
T0   = 555.56
partL-krho = 0.1
partL-dp   = 20e-6
partE-krho = 0.0
partE-dp   = 3e-6
