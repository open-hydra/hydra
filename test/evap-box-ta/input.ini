; ----------------------------------------------------------------------------
; evap-box-ta (TIME-ACCURATE) -- closed quiescent box, evaporating water droplets into N2.
;
; PURPOSE: the Phase 6 mass/energy GATE. Every boundary is a wall, so no mass
; crosses the domain and the balance is exactly
;       d/dt (gas mass in box)  equals  sum over cells of sourceMass
; with no flux term to account for. The JPL nozzle cannot serve this role:
; it has inflow/outflow, and evaporating water into a 1 MPa / 555 K nozzle
; destabilises the gas (see test/evap-probe).
;
; Deliberately NOT a physics validation case -- it validates the COUPLER's
; bookkeeping, not the evaporation model.
;
; Mesh: MESH/mesh.tec, 20x20x1 cells over 0.1 x 0.1 x 0.005 m, written
; directly (a plain box needs no GRIB line construction).
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 20
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30
; NOTE: a uniform quiescent IC has zero residual, so MOSE reports convergence on
; iteration 1 for ANY positive threshold. Harmless here: MI2 resets MOSE's TODO each
; coupling step, so termination is governed by N-coupling.

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.3
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 50
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water droplets, placed directly (DB injection)
; ---------------------------------------------------------------------------
[IGLOO-General]
phase = part      ; ATLAS phase name -> INPUT/part-{phase.txt,properties.dat,bc.txt}
gas-order   = 1
print-dcell = 1

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

[IGLOO-Properties]
Lv    = 2.462478e6
Mv    = 18.015
Tboil = 373.15
cpv   = 2366.95
Le    = 1.0
Yinf  = 0.0
psat  = 3.0e3

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type    = condensed-dispersed
modeling = lagrangian   ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name    = part
rho     = 997
cp      = 4184
; h0: enthalpy at 298.15 K [J/kg], the formation enthalpy of liquid water (-285.83 kJ/mol over 18.015 g/mol);
; ATLAS GPB then writes an absolute Enthalpy_abs column and IGLOO values the evaporated mass on the gas datum
h0      = -15866000
; p_sat from the liquid/vapour pair H2O(L)/H2O of the loaded NASA9 file (A is no species of it)
psat-liquid = H2O(L)
psat-vapour = H2O
alpha-e = 1.0

[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
yH2O = 0.0
dp   = 20e-6   ; CD initial particle diameter (ICB requires dp or rp)

; Closed box: every face is a symmetry slip plane, so no mass, momentum or
; energy crosses it. Unlike a viscous wall this is compatible with the
; Eulerian gas model, which MOSE requires here.
[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

; ---------------------------------------------------------------------------
; MI2 -- material -> gas-species stoichiometry (Phase 6a)
; Water gasifies entirely into the H2O gas species.
; ---------------------------------------------------------------------------
[MI2-Coupling]
products-A = H2O:1.0

; Escape hatch: with the key below set to false MI2 hands MOSE the particle energy on
; IGLOO's table datum without its own reconciliation. The key exists so the datum
; handling is falsifiable from the input file instead of by editing the source.
;
; Measured 2026-09-18 (planar slab, Enthalpy_abs table from h0, IGLOO hOff -1.7113e7 J/kg):
;   offset applied by MI2 : -2.0e4 J per kg of water evaporated (the Lv const residual;
;                           it was -1.7133453e7 on the relative cp*T table)
;   correction ON  : gas COOLS, dT -0.949 K, evaporated 1.4955e-8 kg (run.log)
;   correction OFF : dT -0.941 K -- route B carries the datum, the switch moves 0.008 K
;   (on the relative table the OFF run flipped the sign: +2.874 K, run_datum_off.log)
;
; datum-correction: false
