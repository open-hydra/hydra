; ----------------------------------------------------------------------------
; ice-igloo-burn-box -- one run, two burning phases, two models: the Lagrangian
; phase "partL" of test/igloo-burn-box-direct (IGLOO, combustion direct) and an
; Eulerian phase "partE" beside it (ICE, combustion Beckstead, the burning
; section of test/ice-burn-box-beckstead). What each solver hands the gas is
; checked against its own closed form, and the gas against the sum (check.py).
; The two phases burn into two species of the gas, Ar (partL, a-ar.yaml) and
; He (partE, a-he.yaml): each species gains what its phase burns.
;
; A box of quiescent N2 at 400 K (Ar and He absent at the start), periodic in x and y. ICE's cloud is uniform
; and at rest (loading 0.3 of the gas density, 20 um, 300 K): cycle 1 runs one
; forward-Euler ICE step, so the source ICE stores is that of the initial
; state; cycle 2 keeps it frozen (ICE-iter 0) while IGLOO's four streams are
; solved before each block of 50 time-accurate MOSE iterations.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 1 6
MOSE-iter     = 0 50
IGLOO-iter    = 0 1
ICE-iter      = 1 0
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas, inviscid, time accurate (as evap-box-ta)
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; The gas field is written only at the end of the run.
[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water drops, placed directly (DB injection), drag and heat
; only: no evaporation key, so IGLOO's default NoEvaporation applies and the drops
; keep their mass. A drop that has stopped never leaves the box, so time-end ends
; every parcel at 50 ms of parcel time (about 46 drag and 10 thermal relaxation
; times): its final state goes to OUTPUT/part-snapshot-A*.dat, with the parcel
; time appended to every row (out-time).
; ---------------------------------------------------------------------------
[IGLOO-General]
phase       = partL
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall
; the latent heat of the burning model (the table of this constant-property material carries no Lv
; column)
[IGLOO-Properties]
Lv = 2.26e6

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 1.0
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 300.0

; ---------------------------------------------------------------------------
; ATLAS -- phases, initial and boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 Ar He
thermo    = NASA9
transport = cantera
Tmax      = 3000

; Constant-property liquid water; no evaporation keys, so the material line of
; part-phase.txt carries no model token.
[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
rho      = 1000
cp       = 4184
; the reaction (a-ar.yaml of this folder: the material becomes Ar) and the
; enthalpy of the material at 298.15 K on the scale of the gas: their
; difference, 1.0e6 J/kg, is the heat of reaction the gas receives
h0                 = 1.0e6
particle-mechanism = a-ar
; the burning model, the same lines as test/ice-burn-box: the heat in its
; transfer number, the residue diameter and the burning temperature (GPB
; writes them to the models file); the latent heat is the solver section's
combustion = direct
q-comb     = 1.0e6
d-stop     = 1.0e-6
T-burn     = 300

; Quiescent pure N2 at 1 atm and 400 K; dp is the dispersed-phase initial
; diameter ICB requires.
; the Eulerian phase, burning with the other model: the burning section of
; test/ice-burn-box-beckstead
[GPB-Phase3]
type     = condensed-dispersed
modeling = eulerian
name     = partE
rho      = 1000
cp       = 4184
; the reaction (a-he.yaml of this folder: the material becomes He) and the
; enthalpy of the material at 298.15 K on the scale of the gas: their
; difference, 1.0e6 J/kg, is the heat of reaction the gas receives
h0                 = 1.0e6
particle-mechanism = a-he
combustion = Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 290
beta-part  = 0.3
q-comb     = 1.0e6
d-stop     = 1.0e-6

; krho and kT: the loading and the temperature ratio of the dispersed phases
; at the start (ICE's cloud; IGLOO injects its own streams)
[ICB-Block1]
type = homogeneous
krho = 0.3
kT   = 0.75
p    = 101325.0
T    = 400.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
yAr  = 0.0
yHe  = 0.0
dp   = 20e-6

; x-faces (1 and 2) and y-faces (3 and 4) periodic for every phase: no
; boundary force acts on the gas in x or y, so both momentum components change
; only through the coupling source (a symmetry wall in y would push the gas with
; a pressure force 10 to 20 times the source). The z-faces are symmetry planes:
; the flow is uniform in z, so they exert no net force.
[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

; ---------------------------------------------------------------------------
; ICE -- the Eulerian phase: one forward-Euler step, then a frozen source (as
; test/ice-box); res-threshold 0 so a zero density residual cannot end the ICE
; block before it has produced a source
; ---------------------------------------------------------------------------
[ICE-Parameters]
phase         = partE
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
time-accurate        = true
space-reconstruction = first-order

; density and specific-heat repeat the GPB values of the property table
[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
density       = 1000
specific-heat = 4184
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; ---------------------------------------------------------------------------
; MI2 -- print the coupling report (gas totals and coupler totals per block).
; No material-to-species stoichiometry: nothing evaporates.
; ---------------------------------------------------------------------------
[MI2-Coupling]
report = true
