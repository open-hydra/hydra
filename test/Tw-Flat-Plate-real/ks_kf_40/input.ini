[HYDRA-Parameters]
N-coupling = 400000
FUSS-iter  = 1
ARES-iter  = 1
time-accurate = false

[HYDRA-IO]
coupling-diter = 20000
coupling-wall  = true
coupling-overwrite = false

;

[ARES-Parameters]
newrun = true
res-threshold = 1.0e-8

[ARES-Physics]
equations = navier-stokes

[ARES-Numerics]
time-scheme           = RK3
cfl                   = 0.55
vnn                   = 0.55
time-accurate         = false
riemann-solver        = HLLC
flux-limiter          = minmod
space-reconstruction  = MUSCL
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[ARES-IO]
sol-overwrite = true
sol-format    = tecplot ascii

;

[FUSS-Parameters]
newrun = true
res-threshold = 1.0e-8

[FUSS-Numerics]
time-scheme           = RK3
vnn                   = 0.5
time-accurate         = false
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[FUSS-IO]
sol-overwrite = true
sol-format    = tecplot ascii


[GPB-Phase1]
type = real-fluid
name = fluid
fluid = Air
model = coolprop
pmin = 0.50e5
pmax = 2.0e5
Tmin = 275.0
Tmax = 500.0
NP = 400
NH = 400

[GPB-Phase2]
type = solid
name = plate
material = mat
cp  = 700
rho = 10000
k   = 10.2746

;

[ICB-Block1]
phase = fluid
type  = homogeneous
p   = 1.028e5
T   = 293.0
u   = 60.0

[ICB-Block2]
phase    = plate
material = mat
type     = homogeneous
T    = 343.0

;

[BCB-Block1]
phase = fluid
face1 = inflow
face2 = ambient
face3 = connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
g    = 81.6055
T    = 293.0

[ambient]
type = outlet
p  = 1.e5

[T_plate]
type = wall
T = 393.0

