[HYDRA-Parameters]
N-coupling = 400000
FUSS-iter  = 1
ARES-iter  = 1
time-accurate = false

[HYDRA-IO]
coupling-diter = 20000
coupling-wall  = true
coupling-overwrite = false

;

[ARES-Parameters]
simulation-type = laminar
newrun = true
res-threshold = 1.0e-8

[ARES-Numerics]
time-scheme           = RK3
cfl                   = 0.55
vnn                   = 0.55
time-accurate         = false
riemann-solver        = HLLC
flux-limiter          = minmod
space-reconstruction  = MUSCL
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[ARES-IO]
sol-overwrite = true
sol-format    = tecplot ascii

;

[FUSS-Parameters]
newrun = true
res-threshold = 1.0e-8

[FUSS-Numerics]
time-scheme           = RK3
vnn                   = 0.5
time-accurate         = false
integration-variables = prim
irs                   = true
irs-beta              = 0.5

[FUSS-IO]
sol-overwrite = true
sol-format    = tecplot ascii
