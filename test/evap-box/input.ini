; ----------------------------------------------------------------------------
; evap-box -- closed quiescent box, evaporating water droplets into N2.
;
; Mass/energy check of the coupler: every boundary is a wall, so no mass crosses
; the domain and the balance is exactly
;       d/dt (gas mass in box)  equals  sum over cells of sourceMass
;
; Mesh: MESH/mesh.tec, 20x20x1 cells over 0.1 x 0.1 x 0.005 m.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 5
MOSE-iter     = 200
IGLOO-iter    = 1
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30
; a uniform quiescent IC has zero residual: the run length is set by N-coupling

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 50
; output only
sol-diter     = 267
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water droplets, placed directly (DB injection)
; ---------------------------------------------------------------------------
[IGLOO-General]
phase = part      ; ATLAS phase name -> INPUT/part-{phase.txt,properties.dat,bc.txt}
gas-order   = 1
print-dcell = 1
; output only
out-time    = on
print-dtime = 1.0e-3

[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

; the latent heat, the vapour molar mass and the vapour cp are the Lv, Mv and Cpv columns of
; part-properties.dat, which ATLAS GPB writes for the psat-vapour pair
[IGLOO-Properties]
Tboil = 373.15
Le    = 1.0
Yinf  = 0.0
psat  = 3.0e3

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type    = condensed-dispersed
modeling = lagrangian   ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name    = part
rho     = 997
cp      = 4184
; h0: enthalpy at 298.15 K [J/kg], the formation enthalpy of liquid water (-285.83 kJ/mol over 18.015 g/mol)
h0      = -15866000
; p_sat from the liquid/vapour pair H2O(L)/H2O of the loaded NASA9 file
psat-liquid = H2O(L)
psat-vapour = H2O
alpha-e = 1.0

[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
yH2O = 0.0
dp   = 20e-6   ; initial particle diameter

; Closed box: every face is a symmetry slip plane, so no mass, momentum or
; energy crosses it.
[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

; ---------------------------------------------------------------------------
; MI2 -- material -> gas-species stoichiometry
; Water gasifies entirely into the H2O gas species.
; ---------------------------------------------------------------------------
[MI2-Coupling]
products-A = H2O:1.0
