; steady-ice-smoke: a steady through-flow case (README.md): the JPL nozzle
; of test/JPL-Eulerian-20micron at 38 x 8 cells, steady, MOSE and ICE in one cycle on JPL's schedule. Gate
; test/mi2-checks/p31_steady_check.sh: the converged field does not depend on the local time steps.

[HYDRA-Parameters]
N-coupling    = 40
MOSE-iter     = 500
ICE-iter      = 250
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

[MI2-Coupling]
report = true

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.5
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 500
sol-diter     = 500
sol-format    = tecplot ascii
sol-variables = thermo

[ICE-Parameters]
phase         = part
res-threshold = 0

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
emissivity    = 0 0

[ICE-Family1]
closure = MK

[ICE-Family2]
closure = MK

[ICE-IO]
shell-diter = 250
sol-diter   = 250
sol-format  = tecplot ascii
ic-format   = tecplot ascii

[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 38
ny     = 8

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = symmetry

[ax]
type = symmetry

[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O H2
thermo    = NASA9
transport = cantera
Tmax      = 5000

[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian
name     = part
thermo   = NASA9
material = AL(L) AL2O3(L)
groups   = 1 1
rho      = 1540 2606
particle-mechanism = al-h2o
combustion = Beckstead none
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 2300
beta-part  = 0.02
q-comb     = 1.49e7
d-stop     = 1.445943e-05
d-smoke    = 3.0e-6
; the smoke AL2O3(L) freezes below 2327 K, where AL2O3(a) of nasa9.yaml ends
; (GPB stops a smoke whose table crosses it without ICE's solidification
; model): the heat of fusion and the solid's cp at 2327 K of the database,
; nucleation at ICE's default, 0.8 of T-melt
; (0 for AL(L): not given)
solidification = off on
T-melt         = 0 2327
h-fus          = 0 1.092578e6
cp-solid       = 0 1433.17
T-nuc          = 0 1861.6

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 3000
yN2  = 0.5
yH2O = 0.5
yH2  = 0.0
krho = 0.1 0.0
dp   = 20e-6

[inj]
type = inlet
p0   = 1.0342e6
T0   = 3000
yN2  = 0.5
yH2O = 0.5
yH2  = 0.0
part-krho = 0.1 0.0
part-dp   = 20e-6 3e-6
