; JPL nozzle, hot variant -- MOSE + ICE (Eulerian, phase partE) + IGLOO (Lagrangian, phase partL) at
; T0 2400 K with 20 micron alumina (a diameter) in both condensed phases, each carrying half the loading
; (krho 0.15 each, total mass-flux ratio 0.42857), solidification on in both. The material, gas, laws,
; mesh and schedule of JPL-3solver-20micron; only T0, the size and the solidification keys differ.
;
; The supercooling is 100 K, not the default 465 K, and has no data behind it; the drops never
; freeze completely in this nozzle (no end of the plateau, no solid exit).
;
; No reference data at these conditions: ICE and IGLOO are compared with each other
; (compare_freezing.py, gate test/MI2/validation/JPL-3solver-hot-2micron/check.sh).
;
; Physics note: the nozzle contour (line4) and the centreline (line3) are BOTH slip faces in the
; original setup, i.e. there is no viscous wall -- so the gas is inviscid: equations: euler.

[HYDRA-Parameters]
N-coupling    = 50
MOSE-iter     = 500
IGLOO-iter    = 2
ICE-iter      = 250
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 1
sol-diter     = 100
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian condensed phase
; ---------------------------------------------------------------------------
[IGLOO-General]
phase = partL     ; Lagrangian phase (ATLAS name)
out-file = ALL
print-dcell = 1   ; a trajectory row at every cell crossing

[IGLOO-Models]
drag = Chang
heat = JAXA3

[IGLOO-BC]
ds            = 0.01
iprint        = 1
reference-dir = velocity

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
; ---------------------------------------------------------------------------
[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 190
ny     = 40

[GPB-Phase1]
; the gas of the reference curves (Chang, Hourng and Chien 1996): constant cp, Sutherland viscosity, Prandtl 0.72;
; Chang (1980), Table 1, gives the same cp and gamma, a power-law viscosity (exponent 0.6) and Prandtl 0.74
type      = ideal-gas
name      = gas
species   = mix
cp        = 1070
gamma     = 1.4
mil-law   = sutherland
mil-ref   = 1.716e-5
T-ref     = 273.15
S-mil     = 110.4
Pr        = 0.72
Tmax      = 5000

[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian      ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name     = partE
rho      = 4004.62
cp       = 1380
; solidification: one model and one set of constants in ICE and IGLOO (NIST-JANAF alumina);
; T-nuc T-melt minus 100 K, cut from the default 0.8 T-melt without data, so that the
; 20 micron drops nucleate inside the nozzle (they leave partly frozen)
solidification = on
T-melt         = 2327
h-fus          = 1.09e6
T-nuc          = 2227
cp-solid       = 1360

[GPB-Phase3]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
rho      = 4004.62
cp       = 1380
; solidification: one model and one set of constants in ICE and IGLOO (NIST-JANAF alumina);
; T-nuc T-melt minus 100 K, cut from the default 0.8 T-melt without data, so that the
; 20 micron drops nucleate inside the nozzle (they leave partly frozen)
solidification = on
T-melt         = 2327
h-fus          = 1.09e6
T-nuc          = 2227
cp-solid       = 1360

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 2400
krho = 0.15   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
dp   = 20e-6

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = noz


; Axis (face 3): symmetry for the gas and for both condensed phases, as the reference does:
; Chang, Hourng and Chien 1996 sec. 4 and Chang 1980 impose zero normal velocity and
; symmetric particle variables on the centreline.
[ax]
type = symmetry

; Nozzle contour (line4). TRAP WALL for the condensed phase, slip wall for the gas.
; Particles impacting the nozzle contour must deposit, not specularly reflect back into the core.
[noz]
type = wall

[inj]
type = inlet
p0   = 1.0342e6
T0   = 2400
partE-krho = 0.15   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
partL-krho = 0.15   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
partE-dp   = 20e-6
partL-dp   = 20e-6
[ICE-Parameters]
phase = partE     ; Eulerian phase (ATLAS name)
; every coupling step runs all its ICE iterations: no stop on the residual
res-threshold = 0

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Clift-Gauvin
heat-transfer = JAXA3          ; Carlson-Hoglund continuum Nu, the law of the reference (Chang 1980, eq. 5)
density       = 4004.62
specific-heat = 1380
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
; a numbered field every 125 ICE iterations: the convergence witness compares two of them
sol-diter     = 125
sol-overwrite = false
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
