; ----------------------------------------------------------------------------
; ice-burn -- test/MI2/cases/ice-exchange with its material burning (combustion direct): the
; mass, the heat of reaction and the energy ICE hands the gas, against closed forms.
; INPUT and MESH are those of test/MI2/cases/ice-exchange.
;
; A 20x20x1 box of quiescent N2 at 400 K (MESH/mesh.tec, 0.1 x 0.1 x 0.005 m),
; periodic in x (faces 1 and 2), symmetry planes on the other four faces. The
; ICE condensed phase is uniform: loading 0.3 of the gas density, diameter 20 um,
; velocity 1 m/s along x, temperature 300 K, Stokes drag and Stokes heat (Nu 2).
;
; Cycle 1 runs no MOSE and one forward-Euler ICE step, so the source ICE stores
; is the one evaluated at the initial state. Cycle 2 keeps that source frozen
; (ICE-iter 0) through 200 coupling steps of one time-accurate MOSE iteration
; each. Over cycle 2 the gas must gain exactly the momentum and energy the
; coupling report says ICE hands it, mass included, and all three must match
; the closed forms of README.md (check.py). The drops are at T-burn,
; so they burn from the first source.
; (as in ice-exchange:) ATLAS ICB writes the condensed velocity equal to the
; gas velocity and the number density with pi rounded to 3.14: make_case.py
; rewrites those two columns of INPUT/part-ic.tec after every generation.
; ----------------------------------------------------------------------------

; One MOSE iteration per coupling step, so the coupling report covers every
; time step. MOSE tests res-threshold on steady runs only: a block of this
; time-accurate run always runs its MOSE-iter iterations.
[HYDRA-Parameters]
N-coupling    = 1 200
MOSE-iter     = 0 1
ICE-iter      = 1 0
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- inviscid gas, global time step
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; the transport columns (mil, kl) of the gas field are read by check.py
[MOSE-IO]
shell-diter   = 200
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; ICE -- one forward-Euler step; res-threshold 0 so a zero density residual
; cannot end the ICE block before it has produced a source
; ---------------------------------------------------------------------------
[ICE-Parameters]
phase         = part
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
time-accurate        = true
space-reconstruction = first-order

; density and specific-heat repeat the GPB values of the property table; latent-heat is the latent heat
; of the burning model (the table of this constant-property material carries no Lv column)
[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
density       = 1000
specific-heat = 4184
emissivity    = 0
latent-heat   = 2.26e6

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; the coupling report is the instrument of the gate
[MI2-Coupling]
report = true

; the condensed velocity make_case.py writes into INPUT/part-ic.tec [m/s, along x]
[ice-exchange]
up = 1.0

; ---------------------------------------------------------------------------
; ATLAS -- pure N2 gas, one Eulerian condensed phase, ICs, BCs
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian
name     = part
rho      = 1000
cp       = 4184
; the reaction (a-n2.yaml of this folder: the material becomes N2, the one species of the gas) and the
; enthalpy of the material at 298.15 K on the scale of the gas: their
; difference, 1.0e6 J/kg, is the heat of reaction the gas receives
h0                 = 1.0e6
particle-mechanism = a-n2
; the burning model, the same lines as test/MI2/cases/igloo-burn-box-direct: the heat in its
; transfer number, the residue diameter and the burning temperature (GPB
; writes them to the models file); the latent heat is the solver section's
combustion = direct
q-comb     = 1.0e6
d-stop     = 1.0e-6
T-burn     = 300

; uniform gas at rest; condensed loading 0.3 of the gas density (krho),
; particle temperature 0.75 of the gas temperature (kT), diameter 20 um
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 400.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
krho = 0.3
kT   = 0.75
dp   = 20e-6

; x-periodic box: faces 1 and 2 paired for every phase, the other
; four faces symmetry planes
[BCB-Block1]
face1 = per
face2 = per
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[per]
type  = periodic
faces = 1 2
