; ----------------------------------------------------------------------------
; twins/igloo -- the IGLOO twin of ice-burn: igloo-burn with the burning section
; of ice-burn, line for line (IGLOO, combustion direct), in the gas of that case.
;
; Four streams of 20 um drops enter a box of quiescent N2 at 400 K, periodic in
; x and y. They enter at their burning temperature (300 K) and burn on the d2
; law down to a residue of 1 um, inside the box and inside time-end: all but the
; residue ends in the gas. It ends there as N2 (a-n2.yaml), with the heat
; of reaction that the enthalpy h0 of the material holds (INPUT/part-products.txt).
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 6
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas, inviscid, time accurate (as evap-box-ta)
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; The gas field is written only at the end of the run.
[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water drops, placed directly (DB injection), drag and heat
; only: no evaporation key, so IGLOO's default NoEvaporation applies and the drops
; keep their mass. A drop that has stopped never leaves the box, so time-end ends
; every parcel at 50 ms of parcel time (about 46 drag and 10 thermal relaxation
; times): its final state goes to OUTPUT/part-snapshot-A*.dat, with the parcel
; time appended to every row (out-time).
; ---------------------------------------------------------------------------
[IGLOO-General]
phase       = part
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall
; the latent heat of the burning model (the table of this constant-property material carries no Lv
; column)
[IGLOO-Properties]
Lv = 2.26e6

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 1.0
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 300.0

; ---------------------------------------------------------------------------
; ATLAS -- phases, initial and boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2
thermo    = NASA9
transport = cantera
Tmax      = 3000

; Constant-property liquid water; no evaporation keys, so the material line of
; part-phase.txt carries no model token.
[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = part
rho      = 1000
cp       = 4184
; the reaction (a-n2.yaml of this folder: the material becomes N2, the one species of the gas) and the
; enthalpy of the material at 298.15 K on the scale of the gas: their
; difference, 1.0e6 J/kg, is the heat of reaction the gas receives
h0                 = 1.0e6
particle-mechanism = a-n2
; the burning model, the same lines as ice-burn: the heat in its
; transfer number, the residue diameter and the burning temperature (GPB
; writes them to the models file); the latent heat is the solver section's
combustion = direct
q-comb     = 1.0e6
d-stop     = 1.0e-6
T-burn     = 300

; Quiescent pure N2 at 1 atm and 400 K; dp is the dispersed-phase initial
; diameter ICB requires.
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 400.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
dp   = 20e-6

; x-faces (1 and 2) and y-faces (3 and 4) periodic for every phase: no
; boundary force acts on the gas in x or y, so both momentum components change
; only through the coupling source (a symmetry wall in y would push the gas with
; a pressure force 10 to 20 times the source). The z-faces are symmetry planes:
; the flow is uniform in z, so they exert no net force.
[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

; ---------------------------------------------------------------------------
; MI2 -- print the coupling report (gas totals and coupler totals per block).
; No material-to-species stoichiometry: nothing evaporates.
; ---------------------------------------------------------------------------
[MI2-Coupling]
report = true
