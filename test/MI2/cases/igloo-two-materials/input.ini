; ----------------------------------------------------------------------------
; igloo-two-materials -- igloo-evap with two injected IGLOO materials: water drops
; (water) evaporate into H2O and graphite particles (C(gr)) burn to CO2 with the
; oxygen of the gas (particle-mechanism c-o2, the file c-o2.yaml of this
; folder), in a closed box of air at 350 K. Gate p17 checks, per material, the
; species the gas gained against the mass IGLOO's parcels of that material lost.
;
; Both materials take every DB stream of [IGLOO-BC]. The graphite burns out in
; a few ms; time-end stops the water drops part-way through their life, so the
; two materials hand the gas clearly different amounts and a swap of the
; material index moves every species total.
;
; Mesh: MESH/mesh.tec, 20x20x1 cells over 0.1 x 0.1 x 0.005 m.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 20
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas, inviscid, time accurate (as igloo-evap)
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 50
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian drops of two materials, placed directly (DB injection).
; Every parcel still in flight stops at time-end: its last state goes to
; OUTPUT/part-snapshot-<material>*.dat, with the parcel time (out-time).
; ---------------------------------------------------------------------------
[IGLOO-General]
phase       = part
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.02

; the evaporation model applies to both materials; the graphite burns, and a
; burning material runs the combustion law alone
[IGLOO-Models]
drag        = Stokes
heat        = Ranz-Marshall
evaporation = CEM
interface   = LK

; one value per material (water then C(gr)). Once one material evaporates IGLOO
; asks these of every material: the water takes Lv, Mv and the vapour cp
; from the Lv, Mv and Cpv columns of part-properties.dat (zeros here), the
; graphite does not evaporate (zeros, and its sublimation point as Tboil).
[IGLOO-Properties]
Tboil = 373.15 3915.0
Le    = 1.0 1.0
Yinf  = 0.0 0.0
Mv    = 0.0 0.0
Lv    = 0.0 0.0
cpv   = 0.0 0.0

; Four streams on a line across the middle of the box, moving slowly in +x;
; each material injects all four.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

; ---------------------------------------------------------------------------
; ATLAS -- phases, initial and boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 O2 H2O CO2
thermo    = NASA9
transport = cantera
Tmax      = 3000

; water: constant cp and rho, h0 the formation enthalpy of liquid water at
; 298.15 K, p_sat and the vapour data from the pair H2O(L)/H2O. C(gr): from
; NASA9, burning by the d^n law of Beckstead (constants of igloo-burn-box-rx).
[GPB-Phase2]
type        = condensed-dispersed
modeling    = lagrangian
name        = part
thermo      = NASA9
material    = water C(gr)
groups      = 1 1
rho         = 997 2200
cp          = 4184 710
h0          = -15866000 0
psat-liquid = H2O(L) none
psat-vapour = H2O none
alpha-e     = 1.0
particle-mechanism = c-o2
combustion = none Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 300
beta-part  = 0.02
q-comb     = 3.28e7

[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 0.77
yO2  = 0.23
yH2O = 0.0
yCO2 = 0.0
dp   = 20e-6

; Closed box: every face is a symmetry slip plane, so no mass, momentum or
; energy crosses it.
[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

; ---------------------------------------------------------------------------
; MI2 -- each material converts to its own gas species (INPUT/part-products.txt,
; written by ATLAS); the coupling report on.
; ---------------------------------------------------------------------------
[MI2-Coupling]
report = true
