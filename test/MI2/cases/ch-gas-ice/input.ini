; ch-gas-ice: ice-al with a gas -> ICE channel and a steady MOSE (see check.py)
; ----------------------------------------------------------------------------
; ice-al: a cloud of liquid aluminium burns with the steam of the gas
; in ICE (Beckstead, down to d-stop).
; The alumina is born in family 2 of ICE's phase, empty at the start. A
; 20x20x1 box of quiescent gas at 2791 K, periodic in x. Cycle 1:
; one forward-Euler ICE step at the initial state (its alumina born at its end);
; cycle 2: the source of that step frozen through 200 MOSE iterations. ATLAS
; writes INPUT; the velocity and number density of family 1 are then written
; exactly (make_al_boxes8.py, test/MI2/cases/ice-exchange/make_case.py's format).
; check.py holds the closed forms.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 1 200
MOSE-iter     = 0 1
ICE-iter      = 1 0
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 200
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo

[ICE-Parameters]
phase         = part
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
time-accurate        = true
space-reconstruction = first-order

; the tables of the materials give their density and heat capacity
[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
emissivity    = 0 0

[ICE-Family1]
closure = MK

[ICE-Family2]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

[MI2-Coupling]
report = true

; the condensed velocity written into INPUT/part-ic.tec, family 1 [m/s, along x]
[ice-exchange]
up = 1.0

; the gas: nitrogen, steam, hydrogen (the alumina is not a species of it)
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O H2
thermo    = NASA9
transport = cantera
Tmax      = 4000

; liquid aluminium (family 1) and liquid alumina, the generated alumina (family 2), of the
; NASA9 database with their tables; the densities are the deck's constants
[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian
name     = part
thermo   = NASA9
material = AL(L) AL2O3(L)
groups   = 1 1
rho      = 1540 2606
particle-mechanism = al-h2o
; the burning law of igloo-al; d-stop leaves the mass the carry leaves
; there, 20 um (0.2 x 1.8894)^(1/3); the generated drops are born at 3 um
combustion = Beckstead none
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 2300
beta-part  = 0.02
q-comb     = 1.49e7
d-stop     = 1.445943e-05
d-gen      = 3.0e-6
; the generated alumina AL2O3(L) freezes below 2327 K, where AL2O3(a) of nasa9.yaml ends
; (GPB stops a generated product whose table crosses it without ICE's solidification
; model): the heat of fusion and the solid's cp at 2327 K of the database,
; nucleation at ICE's default, 0.8 of T-melt
; (0 for AL(L): not given)
solidification = off on
T-melt         = 0 2327
h-fus          = 0 1.092578e6
cp-solid       = 0 1433.17
T-nuc          = 0 1861.6

; quiescent steam and nitrogen at 2791 K; the aluminium at 0.1 of the gas
; density at the gas temperature, 20 um; the generated family empty
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 2791.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 0.5
yH2O = 0.5
yH2  = 0.0
krho = 0.1 0.0
kT   = 1.0 1.0
dp   = 20e-6

[BCB-Block1]
face1 = per
face2 = per
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[per]
type  = periodic
faces = 1 2

[MI2-Channels]
cond = gas:H2O ICE:AL2O3(L) constant rate=1e-3 birth-d=3e-6
