; ----------------------------------------------------------------------------
; ice-burnout -- test/MI2/cases/ice-burn-box-beckstead without a residue: the drops
; burn out, and what is left of them when they reach d-burnout is stored by
; ICE and handed whole to the gas over the next MOSE block. The books of the
; whole burn, against closed forms.
; INPUT and MESH are those of test/MI2/cases/ice-exchange.
;
; A 20x20x1 box of quiescent N2 at 400 K (MESH/mesh.tec, 0.1 x 0.1 x 0.005 m),
; periodic in x (faces 1 and 2), symmetry planes on the other four faces. The
; ICE condensed phase is uniform: loading 0.3 of the gas density, diameter 20 um,
; velocity 1 m/s along x, temperature 300 K, Stokes drag and Stokes heat (Nu 2).
;
; Cycle 1 advances ICE alone, one forward-Euler step of dt-max per coupling
; step, through the whole burn (5 ms on the law, 600 steps of 10 us); the gas
; does not move, and the coupling report prints, step by step, what the source
; of each ICE step would hand it. Summed with the step and with the amount
; removed (stored or delivered), the mass, the momentum and the energy handed
; must be those the cloud held at the start (check.py).
; Cycle 2 is one MOSE iteration, which prints the source of the last ICE step
; and hands the gas the stored removal.
; (as in ice-exchange:) ATLAS ICB writes the condensed velocity equal to the
; gas velocity and the number density with pi rounded to 3.14: make_case.py
; rewrites those two columns of INPUT/part-ic.tec after every generation.
; ----------------------------------------------------------------------------

; ICE alone in cycle 1 (the two solvers do not share a time step); one MOSE
; iteration in cycle 2, with the source of the last ICE step in force.
[HYDRA-Parameters]
N-coupling    = 600 1
MOSE-iter     = 0 1
ICE-iter      = 1 0
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- inviscid gas, global time step
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; the transport columns (mil, kl) of the gas field are read by check.py
[MOSE-IO]
shell-diter   = 200
sol-diter     = 200
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; ICE -- forward-Euler steps of dt-max, 500 of them through the burn of a
; drop; res-threshold 0 so a zero density residual cannot end an ICE block
; ---------------------------------------------------------------------------
[ICE-Parameters]
phase         = part
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
dt-max               = 1.0e-5
time-accurate        = true
space-reconstruction = first-order

; density and specific-heat repeat the GPB values of the property table
[ICE-Physics]
drag          = Stokes
heat-transfer = Stokes
density       = 1000
specific-heat = 4184
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; the coupling report is the instrument of the gate
[MI2-Coupling]
report = true

; the condensed velocity make_case.py writes into INPUT/part-ic.tec [m/s, along x]
[ice-exchange]
up = 1.0

; ---------------------------------------------------------------------------
; ATLAS -- pure N2 gas, one Eulerian condensed phase, ICs, BCs
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2
thermo    = NASA9
transport = cantera
Tmax      = 3000

[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian
name     = part
rho      = 1000
cp       = 4184
; the reaction (a-n2.yaml of this folder: the material becomes N2, the one species of the gas) and the
; enthalpy of the material at 298.15 K on the scale of the gas: their
; difference, 1.0e6 J/kg, is the heat of reaction the gas receives
h0                 = 1.0e6
particle-mechanism = a-n2
; the burning law, the same lines as test/MI2/cases/igloo-burn-box-beckstead: d^n(t) with
; n 1.8 and K-burn X-eff 6.95e-7 (a 20 um drop burns in 5 ms), 0.3 of the heat
; of reaction on the drop, burning from 290 K until a drop of 3 um is removed
combustion = Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 290
beta-part  = 0.3
q-comb     = 1.0e6
d-burnout  = 3.0e-6

; uniform gas at rest; condensed loading 0.3 of the gas density (krho),
; particle temperature 0.75 of the gas temperature (kT), diameter 20 um
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 400.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
krho = 0.3
kT   = 0.75
dp   = 20e-6

; x-periodic box: faces 1 and 2 paired for every phase, the other
; four faces symmetry planes
[BCB-Block1]
face1 = per
face2 = per
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[per]
type  = periodic
faces = 1 2
