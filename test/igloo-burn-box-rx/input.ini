; ----------------------------------------------------------------------------
; igloo-burn-box-rx -- test/igloo-burn-box with the reaction named: graphite
; drops burn to CO2 in a gas of N2, O2 and CO2 (particle-mechanism c-o2, the
; file c-o2.yaml of this folder). The gas species and the energy IGLOO hands
; the gas, against closed forms.
;
; Four streams of 20 um drops enter a box of quiescent N2 at 350 K, periodic in
; x and y. They ignite at once (T-ign below their 320 K) and burn out in about
; 5 ms, well inside the box and inside time-end: everything a stream carries in
; ends in the gas: 3.664 kg of CO2 appear and 2.664 kg of O2 vanish per kg of
; graphite (INPUT/part-products.txt), and the heat of reaction is in the
; formation enthalpies of the species.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 6
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas, inviscid, time accurate (as evap-box-ta)
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; The gas field is written only at the end of the run.
[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water drops, placed directly (DB injection), drag and heat
; only: no evaporation key, so IGLOO's default NoEvaporation applies and the drops
; keep their mass. A drop that has stopped never leaves the box, so time-end ends
; every parcel at 50 ms of parcel time (about 46 drag and 10 thermal relaxation
; times): its final state goes to OUTPUT/part-snapshot-A*.dat, with the parcel
; time appended to every row (out-time).
; ---------------------------------------------------------------------------
[IGLOO-General]
phase       = part
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

; ---------------------------------------------------------------------------
; ATLAS -- phases, initial and boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 O2 CO2
thermo    = NASA9
transport = cantera
Tmax      = 3000

; Constant-property liquid water; no evaporation keys, so the material line of
; part-phase.txt carries no model token.
[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = part
thermo   = NASA9
material = C(gr)
rho      = 2200
particle-mechanism = c-o2
; the burning law: d^n(t) with n 1.8 and K-burn X-eff 6.95e-7, so a 20 um drop
; burns out in 5 ms; 0.02 of the heat of reaction stays on the drop
combustion = Beckstead
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 300
beta-part  = 0.02
q-comb     = 3.28e7

; Quiescent pure N2 at 1 atm and 350 K; dp is the dispersed-phase initial
; diameter ICB requires.
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 0.77
yO2  = 0.23
yCO2 = 0.0
dp   = 20e-6

; x-faces (1 and 2) and y-faces (3 and 4) periodic for every phase: no
; boundary force acts on the gas in x or y, so both momentum components change
; only through the coupling source (a symmetry wall in y would push the gas with
; a pressure force 10 to 20 times the source). The z-faces are symmetry planes:
; the flow is uniform in z, so they exert no net force.
[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

; ---------------------------------------------------------------------------
; MI2 -- print the coupling report (gas totals and coupler totals per block).
; No material-to-species stoichiometry: nothing evaporates.
; ---------------------------------------------------------------------------
[MI2-Coupling]
report = true
