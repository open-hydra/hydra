; JPL nozzle (Chang 1980), 20 micron particles -- MOSE + ICE (Eulerian, phase partE) + IGLOO (Lagrangian,
; phase partL): the SAME material solved twice, each phase carrying HALF the loading (krho: 0.17647 each,
; total mass-flux ratio 0.42857: the single-phase cases), so the gas is comparable to Chang MPL and the two
; condensed fields can be compared against each other on the same gas.
;
; Reference data: JPL_chang.dat (centreline Mach number vs x), from chang1980.pdf.
;
; Physics note: the nozzle contour (line4) and the centreline (line3) are BOTH slip faces in the
; original setup, i.e. there is no viscous wall -- so the gas is inviscid: equations: euler.

[HYDRA-Parameters]
N-coupling    = 50
MOSE-iter     = 500
IGLOO-iter    = 2
ICE-iter      = 250
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 1
sol-diter     = 100
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian condensed phase
; ---------------------------------------------------------------------------
[IGLOO-General]
phase = partL     ; Lagrangian phase (ATLAS name)
out-file = ALL

[IGLOO-Models]
drag = Chang
heat = JAXA3

[IGLOO-BC]
ds            = 0.01
iprint        = 1
reference-dir = velocity

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
; ---------------------------------------------------------------------------
[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 190
ny     = 40

[GPB-Phase1]
type      = ideal-gas
name      = gas
mixture   = {N2: 75.4} {O2: 23.3} {Ar: 1.3}
thermo    = NASA9
transport = cantera
Tmax      = 5000

[GPB-Phase2]
type     = condensed-dispersed
modeling = eulerian      ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name     = partE
rho      = 4004.62
cp       = 1380

[GPB-Phase3]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
rho      = 4004.62
cp       = 1380

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 555.56
krho = 0.17647   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
dp   = 20e-6

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = noz


; Axis (face 3): the gas keeps the axisymmetric condition; both condensed phases are mirrored
; at it (symmetry), as the reference does: Chang, Hourng and Chien 1996 sec. 4 and Chang 1980 impose
; zero normal velocity and symmetric particle variables on the centreline.
[ax]
type = axisymmetric
partL-type = symmetry
partE-type = symmetry

; Nozzle contour (line4). TRAP WALL for the condensed phase, slip wall for the gas.
; Particles impacting the nozzle contour must deposit, not specularly reflect back into the core.
[noz]
type = wall

[inj]
type = inlet
p0   = 1.0342e6
T0   = 555.56
partE-krho = 0.17647   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
partL-krho = 0.17647   ; HALF loading per phase: two phases -> total mass-flux ratio 0.42857 as in the single-phase cases
partE-dp   = 20e-6
partL-dp   = 20e-6
[ICE-Parameters]
phase = partE     ; Eulerian phase (ATLAS name)

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Clift-Gauvin
heat-transfer = JAXA3          ; Carlson-Hoglund continuum Nu, the law of the reference (Chang 1980, eq. 5)
density       = 4004.62
specific-heat = 1380
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 250
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
