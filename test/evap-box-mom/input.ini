; ----------------------------------------------------------------------------
; evap-box-mom -- momentum and energy bookkeeping of IGLOO's source coupling.
;
; A variant of evap-box-ta: the same box of quiescent N2, the same four streams of
; 20 micron water drops injected at 0.5 m/s in +x, but the drops do NOT evaporate:
; they only exchange drag and heat with the gas, so no mass and no latent heat
; enter the balance. The gas x-faces are periodic, so no boundary force acts on
; the gas in x and its x-momentum changes only through the coupling source.
; With IGLOO-iter 1 the coupler adds IGLOO's absolute rates to MOSE's residual,
; held fixed over each MOSE block: the gas must gain exactly Fx times the block
; duration in x-momentum and Q times the block duration in energy, where Fx and
; Q are the totals the coupler reports for the block. check.py verifies that
; from the coupling report, and that Fx is the momentum the streams give up.
;
; Deliberately NOT a physics validation case -- it validates the COUPLER's
; momentum and energy bookkeeping, not the drag or heat laws.
;
; Mesh: MESH/mesh.tec, 20x20x1 cells over 0.1 x 0.1 x 0.005 m.
; ----------------------------------------------------------------------------

; Six coupling steps of 50 MOSE iterations each, time accurate. IGLOO solves once
; per step (source mode) and its sources act on the next MOSE block; the first
; block has no sources yet (MOSE converges at once on the uniform initial state).
[HYDRA-Parameters]
N-coupling    = 6
MOSE-iter     = 50
IGLOO-iter    = 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas, inviscid, time accurate (as evap-box-ta)
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

; The gas field is written only at the end of the run.
[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian water drops, placed directly (DB injection), drag and heat
; only: no evaporation key, so IGLOO's default NoEvaporation applies and the drops
; keep their mass. A drop that has stopped never leaves the box, so time-end ends
; every parcel at 50 ms of parcel time (about 46 drag and 10 thermal relaxation
; times): its final state goes to OUTPUT/part-snapshot-A*.dat, with the parcel
; time appended to every row (out-time).
; ---------------------------------------------------------------------------
[IGLOO-General]
phase       = part
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

; Four streams on a line across the middle of the box, moving slowly in +x.
[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 320.0

; ---------------------------------------------------------------------------
; ATLAS -- phases, initial and boundary conditions
; ---------------------------------------------------------------------------
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O
thermo    = NASA9
transport = cantera
Tmax      = 3000

; Constant-property liquid water; no evaporation keys, so the material line of
; part-phase.txt carries no model token.
[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = part
rho      = 997
cp       = 4184

; Quiescent pure N2 at 1 atm and 350 K; dp is the dispersed-phase initial
; diameter ICB requires.
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 350.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 1.0
yH2O = 0.0
dp   = 20e-6

; x-faces (1 and 2) and y-faces (3 and 4) periodic for every phase: no
; boundary force acts on the gas in x or y, so both momentum components change
; only through the coupling source (a symmetry wall in y would push the gas with
; a pressure force 10 to 20 times the source). The z-faces are symmetry planes:
; the flow is uniform in z, so they exert no net force.
[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

; ---------------------------------------------------------------------------
; MI2 -- print the coupling report (gas totals and coupler totals per block).
; No material-to-species stoichiometry: nothing evaporates.
; ---------------------------------------------------------------------------
[MI2-Coupling]
report = true
