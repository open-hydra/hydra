; ----------------------------------------------------------------------------
; igloo-al-box: liquid aluminium burns with the steam of the gas in IGLOO
; (Beckstead, an oxide cap left as a residue).
; The alumina is born in the ICE phase partE, one MK family empty at the
; start, with the burning parcels' velocity and temperature.
; Four streams of 20 um drops in a box of quiescent gas at 2791 K, periodic in
; x and y. Cycle 1: six MOSE blocks of 50 iterations with IGLOO's sources, the
; smoke of each block joining ICE after it; cycle 2: one ICE step, which writes
; ICE's field. ICE exchanges nothing with the gas (NoDrag, NoHeat): the field
; keeps what the smoke was born with. ATLAS writes INPUT (GPB with the smoke
; record, ICB, BCB); test/mi2-checks/p30_al_smoke.py holds the closed forms.
; ----------------------------------------------------------------------------

[HYDRA-Parameters]
N-coupling    = 6 1
MOSE-iter     = 50 0
IGLOO-iter    = 1 0
ICE-iter      = 0 1
relaxation    = false
time-accurate = true

[HYDRA-IO]
ini-diter = 1000000000

[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = true
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 50
sol-diter     = 1000000000
sol-format    = tecplot ascii
sol-variables = thermo

[IGLOO-General]
phase       = partL
gas-order   = 1
print-dcell = 1
out-time    = on
time-end    = 0.05

[IGLOO-Models]
drag = Stokes
heat = Ranz-Marshall

[IGLOO-BC]
x     = 0.02 0.02 0.02 0.02
y     = 0.03 0.045 0.055 0.07
z     = 0.0025
up    = 0.5
diam  = 20.0e-6
mdot  = 1.0e-6
temp0 = 2791.0

[ICE-Parameters]
phase         = partE
res-threshold = 0

[ICE-Numerics]
time-scheme          = euler
cfl                  = 0.4
dt-max               = 1.0e-5
time-accurate        = true
space-reconstruction = first-order

[ICE-Physics]
drag          = NoDrag
heat-transfer = NoHeat
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 1
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; the gas: nitrogen, steam, hydrogen (the alumina is not a species of it)
[GPB-Phase1]
type      = ideal-gas
name      = gas
species   = N2 H2O H2
thermo    = NASA9
transport = cantera
Tmax      = 4000

[GPB-Phase2]
type     = condensed-dispersed
modeling = lagrangian
name     = partL
thermo   = NASA9
material = AL(L) AL2O3(L)
groups   = 1 0
rho      = 1540 2606
particle-mechanism = al-h2o
; the d^n law with n 1.8 and K-burn X-eff 6.95e-7, 0.02 of q-comb on the drop;
; the cap retains 0.2 of the oxide and is left as a residue at burnout, the
; rest of the oxide is the smoke; the smoke drops are born at 3 um
combustion = Beckstead none
product    = AL2O3(L) none
K-burn     = 1.39e-6
n-burn     = 1.8
X-eff      = 0.5
T-ign      = 2300
beta-part  = 0.02
q-comb     = 1.49e7
xi-cap     = 0.2
residue    = on
d-smoke    = 3.0e-6

; the smoke: liquid alumina of the NASA9 database, the deck's density
[GPB-Phase3]
type     = condensed-dispersed
modeling = eulerian
name     = partE
thermo   = NASA9
material = AL2O3(L)
groups   = 1
rho      = 2606
Tmax     = 4000
; the smoke AL2O3(L) freezes below 2327 K, where AL2O3(a) of nasa9.yaml ends
; (GPB stops a smoke whose table crosses it without ICE's solidification
; model): the heat of fusion and the solid's cp at 2327 K of the database,
; nucleation at ICE's default, 0.8 of T-melt
solidification = on
T-melt         = 2327
h-fus          = 1.092578e6
cp-solid       = 1433.17
T-nuc          = 1861.6

; quiescent steam and nitrogen at 1 atm and 2791 K; no smoke at the start
[ICB-Block1]
type = homogeneous
p    = 101325.0
T    = 2791.0
u    = 0.0
v    = 0.0
w    = 0.0
yN2  = 0.5
yH2O = 0.5
yH2  = 0.0
krho = 0.0
kT   = 1.0
dp   = 3e-6

[BCB-Block1]
face1 = perx
face2 = perx
face3 = pery
face4 = pery
face5 = symmetry
face6 = symmetry

[perx]
type  = periodic
faces = 1 2

[pery]
type  = periodic
faces = 3 4

[MI2-Coupling]
report = true
