; JPL nozzle (Chang 1980), 20 micron particles -- MOSE + IGLOO Lagrangian coupling.
; Migrated from the old schema (input.ini.old) for hydra-MI2.
;
; Reference data: JPL_chang.dat (centreline Mach number vs x), from chang1980.pdf.
;
; UNITS: old ATLAS multiplied p0 by 1e5 (bar->Pa) at IC_lib_IG.f90:75; the new one does NOT.
; p0 is therefore given here in Pa (10.342 bar: 1.0342e6 Pa).
;
; Physics note: the nozzle contour (line4) and the centreline (line3) are BOTH slip faces in the
; original setup, i.e. there is no viscous wall -- so the gas is inviscid: equations: euler.

[HYDRA-Parameters]
N-coupling    = 50
MOSE-iter     = 500
IGLOO-iter    = 2
relaxation    = false
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.6
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 1
sol-diter     = 100
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; IGLOO -- Lagrangian condensed phase
; ---------------------------------------------------------------------------
[IGLOO-General]
phase = part      ; ATLAS phase name -> INPUT/part-{phase.txt,properties.dat,bc.txt}
out-file = ALL

[IGLOO-Models]
drag = Chang
heat = JAXA3

[IGLOO-BC]
ds            = 0.01
iprint        = 1
reference-dir = velocity

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
; ---------------------------------------------------------------------------
[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 190
ny     = 40

[GPB-Phase1]
type      = ideal-gas
name      = gas
mixture   = {N2: 75.4} {O2: 23.3} {Ar: 1.3}
thermo    = NASA9
transport = cantera
Tmax      = 5000

[GPB-Phase2]
type = condensed-dispersed
modeling = lagrangian   ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name = part
rho  = 4004.62
cp   = 1380

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 555.56
krho = 0.30
dp   = 20e-6

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = noz


; Axis (face 3): the gas keeps the axisymmetric condition (200); the Lagrangian phase is mirrored
; at it (300, symmetry), as the reference does: Chang, Hourng and Chien 1996 sec. 4 and Chang 1980 impose
; zero normal velocity and symmetric particle variables on the centreline (decision 2026-09-26).
[ax]
type = axisymmetric
part-type = symmetry

; Nozzle contour (line4). TRAP WALL for the condensed phase, slip wall for the gas.
; ATLAS 'wall' with no q/T/qrad gives ig_id: 300 ("Eulerian symmetry", builder_300.f90:44-48)
; -- so the gas keeps exactly the inviscid slip wall it had -- while the dispersed phase gets
; dp_id: 301 (types_bc.f90:201). IGLOO reflects 300 but sends 301 down the "Wall/Outflow"
; branch of bcDef, which marks the parcel gone and records impact point, angle and face area.
; Particles impacting the nozzle contour must deposit, not specularly reflect back into the core.
[noz]
type = wall

[inj]
type = inlet
p0   = 1.0342e6
T0   = 555.56
part-krho = 0.30
part-dp   = 20e-6
