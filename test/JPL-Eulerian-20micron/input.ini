; JPL nozzle (Chang 1980), 20 micron particles -- MOSE + ICE Eulerian coupling.
; Migrated from the old schema (input.ini.old) for hydra-MI2 on 2026-09-02, following the
; same mapping already applied to test/JPL-Lagrangian-20micron.
;
; Reference data: the Lagrangian case carries JPL_chang.dat (centreline Mach vs x).
;
; UNITS: old ATLAS multiplied p0 by 1e5 (bar->Pa) at IC_lib_IG.f90:75; the new one does NOT.
; p0 is therefore given here in Pa (10.342 bar is 1.0342e6 Pa). The old file said 10.342,
; which the new reader would take as 10 Pa.
;
; Physics note: the nozzle contour (line4) and the centreline (line3) are BOTH slip faces,
; i.e. there is no viscous wall -- so the gas is inviscid: equations is euler.

[HYDRA-Parameters]
N-coupling    = 3
MOSE-iter     = 1000
ICE-iter      = 500
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
;   old MOSE-scheme RK/limiter/riemann split into MOSE-Numerics keys;
;   cfl moved out of MOSE-parameters into MOSE-Numerics.
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.5
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 1
sol-diter     = 500
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; ICE -- Eulerian condensed phase (schema of ICE 2026-09-24: [ICE-Numerics], [ICE-Physics]
; with drag / heat-transfer / density / specific-heat, [ICE-Family1] closure, [ICE-IO] ic-format)
; ---------------------------------------------------------------------------
[ICE-Parameters]
phase = part      ; ATLAS phase name -> INPUT/part-{bc.txt,ic.tec,properties.dat}

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Clift-Gauvin   ; the correlation the older input named Chang
heat-transfer = JAXA3          ; Carlson-Hoglund continuum Nu, the law of the reference (Chang 1980, eq. 5)
density       = 4004.62
specific-heat = 1380
emissivity    = 0              ; IGLOO has no radiation model, so ICE radiates none either

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 250
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
; ---------------------------------------------------------------------------
[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 190
ny     = 40

[GPB-Phase1]
type      = ideal-gas
name      = gas
mixture   = {N2: 75.4} {O2: 23.3} {Ar: 1.3}
thermo    = NASA9
transport = cantera
Tmax      = 5000

[GPB-Phase2]
type = condensed-dispersed
modeling = eulerian   ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name = part
rho  = 4004.62
cp   = 1380

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 555.56
krho = 0.30
dp   = 20e-6

; Numeric BC types are gone. Old 4 is inlet, 11 is extrapolation, 3 is slip.
; The two old sym faces are split: face3 is the axis of the 2Daxi mesh
; (line3 is axis) so it is axisymmetric; face4 is the nozzle contour, so it is
; a plain symmetry/slip plane. Same split as the Lagrangian case.
[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = symmetry

; Axis (face 3): the gas keeps the axisymmetric condition (200); the Eulerian phase
; is mirrored at it (300, symmetry).
[ax]
type      = axisymmetric
part-type = symmetry

[inj]
type = inlet
p0   = 1.0342e6
T0   = 555.56
part-krho = 0.30
part-dp   = 20e-6
