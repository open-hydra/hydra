; JPL nozzle (Chang 1980), 20 micron particles -- MOSE + ICE Eulerian coupling.
;
; Reference data: the Lagrangian case carries JPL_chang.dat (centreline Mach vs x).
;
; Physics note: the nozzle contour (line4) and the centreline (line3) are BOTH slip faces,
; i.e. there is no viscous wall -- so the gas is inviscid: equations is euler.

[HYDRA-Parameters]
N-coupling    = 24
MOSE-iter     = 1000
ICE-iter      = 500
time-accurate = false

[HYDRA-IO]
ini-diter = 1000000000

; ---------------------------------------------------------------------------
; MOSE -- Eulerian gas
; ---------------------------------------------------------------------------
[MOSE-Parameters]
res-threshold = 1e-30

[MOSE-Physics]
equations = euler

[MOSE-Numerics]
cfl                   = 0.5
time-scheme           = RK3
time-accurate         = false
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[MOSE-IO]
shell-diter   = 1
sol-diter     = 500
sol-format    = tecplot ascii
sol-variables = thermo transport

; ---------------------------------------------------------------------------
; ICE -- Eulerian condensed phase
; ---------------------------------------------------------------------------
[ICE-Parameters]
phase = part      ; ATLAS phase name -> INPUT/part-{bc.txt,ic.tec,properties.dat}

[ICE-Numerics]
time-scheme          = RK3
cfl                  = 0.4
time-accurate        = false
space-reconstruction = MUSCL
flux-limiter         = vanleer

[ICE-Physics]
drag          = Clift-Gauvin
heat-transfer = JAXA3          ; Carlson-Hoglund continuum Nu, the law of the reference (Chang 1980, eq. 5)
density       = 4004.62
specific-heat = 1380
emissivity    = 0

[ICE-Family1]
closure = MK

[ICE-IO]
shell-diter = 1
sol-diter   = 250
sol-format  = tecplot ascii
ic-format   = tecplot ascii

; ---------------------------------------------------------------------------
; ATLAS -- mesh, phases, BCs, ICs
; ---------------------------------------------------------------------------
[GRIB-meshgen]
type    = 2Daxi
axis    = 1e-8
outpath = ./MESH/

[GRIB-Block1]
method = gridgen
line1  = vertical
line2  = vertical
line3  = axis
line4  = MESH/JPL_profile.dat
nx     = 190
ny     = 40

[GPB-Phase1]
; the gas of the reference curves (Chang, Hourng and Chien 1996): constant cp, Sutherland viscosity, Prandtl 0.72;
; Chang (1980), Table 1, gives the same cp and gamma, a power-law viscosity (exponent 0.6) and Prandtl 0.74
type      = ideal-gas
name      = gas
species   = mix
cp        = 1070
gamma     = 1.4
mil-law   = sutherland
mil-ref   = 1.716e-5
T-ref     = 273.15
S-mil     = 110.4
Pr        = 0.72
Tmax      = 5000

[GPB-Phase2]
type = condensed-dispersed
modeling = eulerian   ; ATLAS: lagrangian (IGLOO) | eulerian (ICE)
name = part
rho  = 4004.62
cp   = 1380

[ICB-Block1]
type = nozzle
p0   = 1.0342e6
T0   = 555.56
krho = 0.30
dp   = 20e-6

[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = symmetry

; Axis (face 3): symmetry for the gas and for the Eulerian phase.
[ax]
type      = symmetry

[inj]
type = inlet
p0   = 1.0342e6
T0   = 555.56
part-krho = 0.30
part-dp   = 20e-6
