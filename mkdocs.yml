# Built with Zensical (zensical build), which reads this file: see requirements-docs.txt. MkDocs with Material for
# MkDocs builds it too
site_name: hydra Documentation
site_url: https://open-hydra.github.io/hydra/
repo_name: open-hydra/hydra
repo_url: https://github.com/open-hydra/hydra

docs_dir: docs

# Strict mode turns these warnings into errors: a link to a missing page or anchor, an absolute link (it would
# leave https://open-hydra.github.io/hydra/ on the published site) and a link to a directory
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

theme:
  name: material
  font:
    text: Roboto
    code: Fira Code
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true        # a missing file (a figure) fails the build
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - search:
      lang: en

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/hydra.css      # the Hydra scheme of the home page, shared with the other codes

nav:
  - Home: index.md

  - Getting Started:
    - Overview: getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md

  - User Guide:
    - user/index.md
    - Figaro CLI: user/figaro.md
    - Hydra Input: user/input.md
    - Running Cases in Hydra: user/using.md
    - Multiphase Coupling (hydra-MI2): user/mi2.md
    - Parallel Execution: user/parallel.md
    - Hydra Registry: user/registry.md

  - Theory Guide:
    - theory/index.md

  - Verification & Validation:
    - vv/index.md
    - Conjugate Flat Plate: vv/conjugate-flat-plate.md

  - Developer Guide:
    - development/index.md
    - Code Structure: development/structure.md
    - Testing: development/testing.md
    - Contributing: development/contributing.md

  - About:
    - about/index.md
    - Acknowledgements: about/acknowledgements.md
    - License: about/license.md
